name: Daily Inference Batch - Part 1 (1~5)

on:
  schedule:
    # 매주 월~금 오후 6시 (한국시간 KST 기준) -> UTC 기준 오전 9시
    - cron: '0 9 * * 1-5'
  workflow_dispatch:
    inputs:
      extra_args:
        description: '추가 파라미터 (예: --end 20260803)'
        required: false
        default: ''

jobs:
  run-batch-part1:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    
    steps:
    - name: 📥 저장소 코드 가져오기 (Checkout)
      uses: actions/checkout@v4
      with:
        lfs: true
        
    - name: 🐍 Python 3.12 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: 📦 필요 라이브러리 설치 (Install Dependencies)
      working-directory: ./sgt_inference_batch
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 🚀 보안 배치 스크립트 실행 Part 1 (Decrypt -> Run 1~5 -> Encrypt)
      working-directory: ./sgt_inference_batch
      env:
        DART_API_KEY: ${{ secrets.DART_API_KEY }}
        DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
        KRX_ID: ${{ secrets.KRX_ID }}
        KRX_PW: ${{ secrets.KRX_PW }}
      run: |
        # KST 기준 실행일자 지정
        if [ -z "${{ github.event.inputs.extra_args }}" ]; then
          TARGET_DATE=$(TZ='Asia/Seoul' date +%Y%m%d)
          EXTRA_ARGS="--end $TARGET_DATE"
        else
          EXTRA_ARGS="${{ github.event.inputs.extra_args }}"
        fi
        
        # Part 2로 전달할 인자값을 텍스트 파일로 저장
        echo "$EXTRA_ARGS" > batch_args.txt
        
        echo "🚀 Batch Date Args: $EXTRA_ARGS"
        python decrypt_and_run.py --only 1,2,3,4,5 $EXTRA_ARGS
        
    - name: 💾 데이터 압축 및 릴리즈 업로드 (Releases)
      working-directory: ./sgt_inference_batch
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 1. 대용량 DB와 파라미터 파일 압축
        tar -czvf data.tar.gz data/*.enc batch_args.txt
        
        # 2. 릴리즈가 없으면 자동 생성
        gh release view latest-batch-data || gh release create latest-batch-data --title "Latest Batch Data" --notes "Auto-generated batch data storage"
        
        # 3. 릴리즈에 첨부파일(Asset) 덮어쓰기 업로드
        gh release upload latest-batch-data data.tar.gz --clobber
        
    - name: 💾 로그 파일만 GitHub에 자동 저장 (Commit & Push)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add sgt_inference_batch/scheduler_log.txt || true
        git commit -m "🚀 [Auto] 일배치 Part 1 완료 ($(date +'%Y-%m-%d %H:%M:%S'))" || echo "No changes to commit"
        git push origin main
