name: Daily Inference Batch - Part 1 (1~5)

on:
  schedule:
    # 매주 월~금 오후 09시 15분 (한국시간 KST 기준) -> UTC 기준 오후 12시 15분
    - cron: '15 12 * * 1-5'
  workflow_dispatch:
    inputs:
      extra_args:
        description: '추가 파라미터 (예: --end 20260803)'
        required: false
        default: ''

jobs:
  run-batch-part1:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      TZ: Asia/Seoul
    
    steps:
    - name: 📥 저장소 코드 가져오기 (Checkout)
      uses: actions/checkout@v4
      with:
        lfs: true
        
    - name: 🐍 Python 3.12 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: 📦 필요 라이브러리 설치 (Install Dependencies)
      working-directory: ./sgt_inference_batch
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 📥 이전 데이터 릴리즈에서 다운로드 및 무결성 검증 (Releases)
      working-directory: ./sgt_inference_batch
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 1. 릴리즈에서 db.tar.gz 다운로드
        gh release download latest-batch-data -p "db.tar.gz" --clobber || gh release download latest-batch-data -p "data.tar.gz" --clobber || {
          echo "❌ [치명적 오류] latest-batch-data 릴리즈에서 db.tar.gz를 다운로드할 수 없습니다! 배치를 중단합니다."
          exit 1
        }
        tar -xzvf db.tar.gz || tar -xzvf data.tar.gz || {
          echo "❌ [치명적 오류] db.tar.gz 압축 해제 실패! 배치를 중단합니다."
          exit 1
        }
        
        # 2. 개별 수동 업로드 파일 확인 (있다면 덮어쓰기)
        gh release download latest-batch-data -p "*.enc" --dir data/ --clobber || echo "No standalone enc files"
        
        # 3. 💡 [엄격한 무결성 검증] DB 파일 존재 및 최소 크기(50MB) 검증 (실패 시 즉시 중단)
        if [ ! -f "data/seongjangtong7y.db.enc" ]; then
          echo "❌ [치명적 오류] data/seongjangtong7y.db.enc 파일이 존재하지 않습니다! 배치를 즉시 중단합니다."
          exit 1
        fi
        
        DB_SIZE=$(stat -c%s "data/seongjangtong7y.db.enc" 2>/dev/null || echo 0)
        if [ "$DB_SIZE" -lt 50000000 ]; then
          echo "❌ [치명적 오류] DB 크기가 비정상($DB_SIZE bytes, 최소 50MB 필요)입니다! 기존 데이터 보호를 위해 배치를 즉시 중단합니다."
          exit 1
        fi
        
        echo "✅ 정상 DB 무결성 검증 완료 (크기: $DB_SIZE bytes)"
        
    - name: 🚀 보안 배치 스크립트 실행 Part 1 (Decrypt -> Run 1~5 -> Encrypt)
      working-directory: ./sgt_inference_batch
      env:
        DART_API_KEY: ${{ secrets.DART_API_KEY }}
        DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
        KRX_ID: ${{ secrets.KRX_ID }}
        KRX_PW: ${{ secrets.KRX_PW }}
      run: |
        # KST 기준 실행일자 지정
        if [ -z "${{ github.event.inputs.extra_args }}" ]; then
          TARGET_DATE=$(TZ='Asia/Seoul' date +%Y%m%d)
          EXTRA_ARGS="--end $TARGET_DATE"
        else
          EXTRA_ARGS="${{ github.event.inputs.extra_args }}"
        fi
        
        # Part 2로 전달할 인자값을 텍스트 파일로 저장
        echo "$EXTRA_ARGS" > batch_args.txt
        
        echo "🚀 Batch Date Args: $EXTRA_ARGS"
        python decrypt_and_run.py --only 1,2,3,4,5 $EXTRA_ARGS
        
    - name: 🛑 휴장일 체크 및 중단
      working-directory: ./sgt_inference_batch
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ -f "HOLIDAY.flag" ]; then
          echo "휴장일이 감지되었습니다. 배치를 중단합니다."
          gh run cancel ${{ github.run_id }}
          sleep 60
        fi
        
    - name: 💾 데이터 압축 및 릴리즈 업로드 (Releases)
      working-directory: ./sgt_inference_batch
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 1. 갱신된 DB 무결성 재검증
        if [ ! -f "data/seongjangtong7y.db.enc" ]; then
          echo "❌ [치명적 오류] 암호화된 DB 파일이 생성되지 않았습니다! 릴리즈 업로드를 중단합니다."
          exit 1
        fi
        
        DB_SIZE=$(stat -c%s "data/seongjangtong7y.db.enc" 2>/dev/null || echo 0)
        if [ "$DB_SIZE" -lt 50000000 ]; then
          echo "❌ [치명적 오류] 갱신된 DB 크기가 비정상($DB_SIZE bytes)입니다! 릴리즈 덮어쓰기를 중단합니다."
          exit 1
        fi
        
        # 2. 갱신된 DB와 파라미터 파일 압축 (db.tar.gz)
        tar -czvf db.tar.gz data/seongjangtong7y.db.enc batch_args.txt
        
        # 3. 릴리즈가 없으면 자동 생성
        gh release view latest-batch-data || gh release create latest-batch-data --title "Latest Batch Data" --notes "Auto-generated batch data storage"
        
        # 4. 릴리즈에 첨부파일(Asset) 덮어쓰기 업로드
        gh release upload latest-batch-data db.tar.gz --clobber
        
    - name: 💾 로그 파일만 GitHub에 자동 저장 (Commit & Push)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add sgt_inference_batch/scheduler_log.txt || true
        git commit -m "🚀 [Auto] 일배치 Part 1 완료 ($(date +'%Y-%m-%d %H:%M:%S'))" || echo "No changes to commit"
        git push origin main
