name: Daily Inference Batch - Part 4 (12~13)

on:
  workflow_run:
    workflows: ["Daily Inference Batch - Part 3 (9~10)"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      extra_args:
        description: '추가 파라미터 (예: --end 20260803)'
        required: false
        default: ''

jobs:
  run-batch-part4:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Seoul 
    
    steps: 
    - name: 📥 저장소 코드 가져오기 (Checkout)
      uses: actions/checkout@v4
      with:
        lfs: true
        
    - name: 📥 이전 데이터 릴리즈에서 다운로드 (Releases)
      working-directory: ./sgt_inference_batch
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
      run: |
        # 1. 최신 db.tar.gz 다운로드 (구버전 data.tar.gz 호환)
        gh release download latest-batch-data -p "db.tar.gz" --clobber || gh release download latest-batch-data -p "data.tar.gz" --clobber || echo "No db release found"
        tar -xzvf db.tar.gz || tar -xzvf data.tar.gz || echo "No db archive found"
        
        # 2. Part 3에서 생성한 features.tar.gz 다운로드
        gh release download latest-batch-data -p "features.tar.gz" --clobber || echo "No features archive found"
        tar -xzvf features.tar.gz || echo "No features extracted"
        
        # 3. 개별 수동 업로드 파일 확인
        gh release download latest-batch-data -p "*.enc" --dir data/ --clobber || echo "No standalone enc files found"
        
        # 4. 💡 [안전 Fallback] DB 파일이 없거나 비정상 크기(50MB 미만)일 경우 v1.0.0 원본 DB에서 복구
        if [ ! -f "data/seongjangtong7y.db.enc" ] || [ $(stat -c%s "data/seongjangtong7y.db.enc" 2>/dev/null || echo 0) -lt 50000000 ]; then
          echo "⚠️ 정상 DB를 찾을 수 없습니다. v1.0.0 릴리즈에서 원본 DB를 다운로드합니다..."
          gh release download v1.0.0 -p "seongjangtong7y.db.enc" --dir data/ --clobber || echo "Fallback download failed"
        fi
        
    - name: 🐍 Python 3.12 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: 📦 필요 라이브러리 설치 (Install Dependencies)
      working-directory: ./sgt_inference_batch
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 🚀 보안 배치 스크립트 실행 Part 4 (Decrypt -> Run 12~13 AI 추론 & JSON 암호화 -> Encrypt & Clean)
      working-directory: ./sgt_inference_batch
      env:
        DART_API_KEY: ${{ secrets.DART_API_KEY }}
        DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
        ENABLE_JSON_ENCRYPTION: "1"
        KRX_ID: ${{ secrets.KRX_ID }}
        KRX_PW: ${{ secrets.KRX_PW }}
      run: |
        # Part 3에서 전달받은 파라미터(기준일자) 파일을 읽어옴
        if [ -f "batch_args.txt" ]; then
          EXTRA_ARGS=$(cat batch_args.txt)
          echo "📥 Part 3에서 전달받은 파라미터: $EXTRA_ARGS"
        else
          echo "⚠️ batch_args.txt 파일이 없습니다. 기본 파라미터를 사용합니다."
          TARGET_DATE=$(TZ='Asia/Seoul' date +%Y%m%d)
          EXTRA_ARGS="--end $TARGET_DATE"
        fi
        
        # 수동 실행 시 명시적으로 파라미터를 지정한 경우 덮어쓰기
        if [ -n "${{ github.event.inputs.extra_args }}" ]; then
          EXTRA_ARGS="${{ github.event.inputs.extra_args }}"
          echo "📥 수동 입력 파라미터로 덮어씁니다: $EXTRA_ARGS"
        fi
        
        # 💡 이전 잔여 JSON 파일 완전 초기화 (과거 평문/암호문 파일 청소)
        rm -rf data/json_export
        mkdir -p data/json_export

        echo "🚀 Batch Date Args: $EXTRA_ARGS"
        python decrypt_and_run.py --only 12,13 $EXTRA_ARGS
        
    - name: 💾 최종 데이터 및 암호화 JSON 릴리즈 업로드 (Releases)
      working-directory: ./sgt_inference_batch
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 1. 암호화된 JSON 결과물 압축 및 릴리즈 업로드 (json_export.tar.gz)
        if [ -d "data/json_export" ]; then
          tar -czvf json_export.tar.gz data/json_export/*.enc || true
          if [ -f "json_export.tar.gz" ]; then
            gh release upload latest-batch-data json_export.tar.gz --clobber
          fi
        fi
        
        # 2. 💡 [안전 가드] DB 파일이 정상 크기(50MB 이상)일 때만 추론 결과가 반영된 db.tar.gz 갱신 업로드
        if [ -f "data/seongjangtong7y.db.enc" ] && [ $(stat -c%s "data/seongjangtong7y.db.enc" 2>/dev/null || echo 0) -gt 50000000 ]; then
          tar -czvf db.tar.gz data/seongjangtong7y.db.enc
          gh release upload latest-batch-data db.tar.gz --clobber
          echo "✅ 추론 결과가 반영된 정상 DB(db.tar.gz) 업로드 완료"
        fi
        
    - name: 🌐 암호화 JSON CDN 배포 (gh-pages 브랜치 Force Push)
      working-directory: ./sgt_inference_batch
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [ -d "data/json_export" ]; then
          cd data/json_export
          
          # Git 초기화 및 고아(orphan) 단일 커밋 생성 (과거 히스토리 완전 삭제)
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 💡 보안: 오직 암호화된 .enc 파일만 git add (평문 .json은 절대 추가하지 않음)
          git add *.enc
          git commit -m "🚀 [CDN] 최신 암호화 JSON 데이터 배포 ($(date +'%Y-%m-%d %H:%M:%S'))"
          
          # gh-pages 브랜치로 강제 덮어쓰기 (과거 커밋 누적 없이 항상 당일 암호화 데이터만 유지)
          git branch -M gh-pages
          git remote add origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          git push -u origin gh-pages --force
          
          echo "✅ gh-pages 브랜치로 100% 암호화 JSON CDN 배포 완료"
        else
          echo "⚠️ data/json_export 폴더가 존재하지 않습니다."
        fi

    - name: 💾 로그 파일만 GitHub에 자동 저장 (Commit & Push)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add sgt_inference_batch/scheduler_log.txt || true
        
        git commit -m "🚀 [Auto] 일배치 Part 4 완료 (AI 추론 및 JSON 암호화 완료 - $(date +'%Y-%m-%d %H:%M:%S'))" || echo "No changes to commit"
        git push origin main
