name: Daily Inference Batch - Part 2 (6~13)

on:
  workflow_run:
    workflows: ["Daily Inference Batch - Part 1 (1~5)"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      extra_args:
        description: '추가 파라미터 (예: --end 20260803)'
        required: false
        default: ''

jobs:
  run-batch-part2:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      TZ: Asia/Seoul
    
    steps:
    - name: 📥 저장소 코드 가져오기 (Checkout)
      uses: actions/checkout@v4
      with:
        lfs: true
        
    - name: 📥 이전 데이터 릴리즈에서 다운로드 (Releases)
      working-directory: ./sgt_inference_batch
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release download latest-batch-data -p "data.tar.gz" --clobber || echo "No previous release found"
        tar -xzvf data.tar.gz || echo "No data.tar.gz found"
        
    - name: 🐍 Python 3.12 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: 📦 필요 라이브러리 설치 (Install Dependencies)
      working-directory: ./sgt_inference_batch
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 🚀 보안 배치 스크립트 실행 Part 2 (Decrypt -> Run 6~13 -> Encrypt)
      working-directory: ./sgt_inference_batch
      env:
        DART_API_KEY: ${{ secrets.DART_API_KEY }}
        DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
        KRX_ID: ${{ secrets.KRX_ID }}
        KRX_PW: ${{ secrets.KRX_PW }}
      run: |
        # Part 1에서 생성하여 푸시한 파라미터(기준일자) 파일을 읽어옴
        if [ -f "batch_args.txt" ]; then
          EXTRA_ARGS=$(cat batch_args.txt)
          echo "📥 Part 1에서 전달받은 파라미터: $EXTRA_ARGS"
        else
          echo "⚠️ batch_args.txt 파일이 없습니다. 기본 파라미터를 사용합니다."
          TARGET_DATE=$(TZ='Asia/Seoul' date +%Y%m%d)
          EXTRA_ARGS="--end $TARGET_DATE"
        fi
        
        # 수동 실행 시 명시적으로 파라미터를 지정한 경우 덮어쓰기
        if [ -n "${{ github.event.inputs.extra_args }}" ]; then
          EXTRA_ARGS="${{ github.event.inputs.extra_args }}"
          echo "📥 수동 입력 파라미터로 덮어씁니다: $EXTRA_ARGS"
        fi
        
        echo "🚀 Batch Date Args: $EXTRA_ARGS"
        python decrypt_and_run.py --only 6,7,8,9,10,11,12,13 $EXTRA_ARGS
        
    - name: 💾 데이터 압축 및 릴리즈 업로드 (Releases)
      working-directory: ./sgt_inference_batch
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tar -czvf data.tar.gz data/*.enc
        gh release upload latest-batch-data data.tar.gz --clobber
        
    - name: 💾 로그 파일만 GitHub에 자동 저장 (Commit & Push)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add sgt_inference_batch/scheduler_log.txt || true
        
        git commit -m "🚀 [Auto] 일배치 Part 2 완료 ($(date +'%Y-%m-%d %H:%M:%S'))" || echo "No changes to commit"
        git push origin main
