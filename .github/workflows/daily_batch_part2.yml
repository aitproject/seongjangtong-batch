name: Daily Inference Batch - Part 2 (6~8, 11)

on:
  workflow_run:
    workflows: ["Daily Inference Batch - Part 1 (1~5)"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      extra_args:
        description: '추가 파라미터 (예: --end 20260803)'
        required: false
        default: ''

jobs:
  run-batch-part2:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Seoul 
    
    steps: 
    - name: 📥 저장소 코드 가져오기 (Checkout)
      uses: actions/checkout@v4
      with:
        lfs: true
        
    - name: 📥 이전 데이터 릴리즈에서 다운로드 (Releases)
      working-directory: ./sgt_inference_batch
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
      run: |
        # 1. 최신 db.tar.gz 다운로드 시도 (구버전 data.tar.gz 호환)
        gh release download latest-batch-data -p "db.tar.gz" --clobber || gh release download latest-batch-data -p "data.tar.gz" --clobber || echo "No previous release found"
        tar -xzvf db.tar.gz || tar -xzvf data.tar.gz || echo "No tar archive found"
        
        # 2. 개별 수동 업로드 파일 확인
        gh release download latest-batch-data -p "*.enc" --dir data/ --clobber || echo "No standalone enc files found"
        
        # 3. 💡 [안전 Fallback] DB 파일이 없거나 비정상 크기(50MB 미만)일 경우 v1.0.0 원본 DB에서 복구
        if [ ! -f "data/seongjangtong7y.db.enc" ] || [ $(stat -c%s "data/seongjangtong7y.db.enc" 2>/dev/null || echo 0) -lt 50000000 ]; then
          echo "⚠️ 정상 DB를 찾을 수 없습니다. v1.0.0 릴리즈에서 원본 DB를 다운로드합니다..."
          gh release download v1.0.0 -p "seongjangtong7y.db.enc" --dir data/ --clobber || echo "Fallback download failed"
        fi
        
    - name: 🐍 Python 3.12 환경 세팅
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: 📦 필요 라이브러리 설치 (Install Dependencies)
      working-directory: ./sgt_inference_batch
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: 🚀 보안 배치 스크립트 실행 Part 2 (Decrypt -> Run 6~8, 11 -> Encrypt)
      working-directory: ./sgt_inference_batch
      env:
        DART_API_KEY: ${{ secrets.DART_API_KEY }}
        DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
        KRX_ID: ${{ secrets.KRX_ID }}
        KRX_PW: ${{ secrets.KRX_PW }}
      run: |
        # Part 1에서 생성하여 전달한 파라미터(기준일자) 파일을 읽어옴
        if [ -f "batch_args.txt" ]; then
          EXTRA_ARGS=$(cat batch_args.txt)
          echo "📥 Part 1에서 전달받은 파라미터: $EXTRA_ARGS"
        else
          echo "⚠️ batch_args.txt 파일이 없습니다. 기본 파라미터를 사용합니다."
          TARGET_DATE=$(TZ='Asia/Seoul' date +%Y%m%d)
          EXTRA_ARGS="--end $TARGET_DATE"
        fi
        
        # 수동 실행 시 명시적으로 파라미터를 지정한 경우 덮어쓰기
        if [ -n "${{ github.event.inputs.extra_args }}" ]; then
          EXTRA_ARGS="${{ github.event.inputs.extra_args }}"
          echo "📥 수동 입력 파라미터로 덮어씁니다: $EXTRA_ARGS"
        fi
        
        # Part 3로 전달할 파라미터 파일 유지/갱신
        echo "$EXTRA_ARGS" > batch_args.txt
        
        echo "🚀 Batch Date Args: $EXTRA_ARGS"
        python decrypt_and_run.py --only 6,7,8,11 $EXTRA_ARGS
        
    - name: 💾 데이터 압축 및 릴리즈 업로드 (Releases)
      working-directory: ./sgt_inference_batch
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Part 3에 인자를 전달하기 위해 갱신된 DB와 파라미터 파일만 압축 (db.tar.gz)
        tar -czvf db.tar.gz data/seongjangtong7y.db.enc batch_args.txt
        gh release upload latest-batch-data db.tar.gz --clobber
        
    - name: 💾 로그 파일만 GitHub에 자동 저장 (Commit & Push)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        git add sgt_inference_batch/scheduler_log.txt || true
        
        git commit -m "🚀 [Auto] 일배치 Part 2 완료 ($(date +'%Y-%m-%d %H:%M:%S'))" || echo "No changes to commit"
        git push origin main
